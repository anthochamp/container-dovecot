# Main Dovecot configuration
# https://doc.dovecot.org/2.4.2/core/config/overview.html
#
# This file (and conf.d/) is the complete, explicit Dovecot configuration.
# The base Docker image's /etc/dovecot is wiped before our COPY in the
# Dockerfile so no implicit defaults bleed through.

dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.2

base_dir = /run/dovecot
state_dir = /run/dovecot

# Protocols: submission is intentionally omitted (we are an IMAP server, not
# an MTA; outbound submission goes through Postfix)
# https://doc.dovecot.org/2.4.2/core/config/protocols.html
protocols = imap pop3 lmtp sieve

# Admin password for doveadm; value comes from DOVEADM_PASSWORD env var
doveadm_password = %{env:DOVEADM_PASSWORD}

# Pass Rspamd connection details into Dovecot's environment so that rspamc
# (called from Sieve extprograms) can connect to the right host/port.
# The _DOVECOT_RSPAMC_* vars are computed and exported by the entrypoint.
# https://doc.dovecot.org/2.4.2/core/config/service.html#import-environment
import_environment {
  _DOVECOT_RSPAMC_HOST = %{env:_DOVECOT_RSPAMC_HOST}
  _DOVECOT_RSPAMC_PORT = %{env:_DOVECOT_RSPAMC_PORT}
  DOVECOT_RSPAMD_FUZZY_DENIED_TAG = %{env:DOVECOT_RSPAMD_FUZZY_DENIED_TAG}
  DOVECOT_RSPAMD_FUZZY_WHITE_TAG = %{env:DOVECOT_RSPAMD_FUZZY_WHITE_TAG}
}

# Mail storage format and index layout
# https://doc.dovecot.org/2.4.2/core/config/mail_location.html
mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_utf8_extensions = yes

# Mail paths and system user are in conf.d/10-mail.conf.j2 (Jinja2-rendered
# at startup after the vmail volume is mounted)

# System user that owns the mail files
mail_uid = vmail
mail_gid = vmail

# Per-user IMAP METADATA attribute store (RFC 5464)
# https://doc.dovecot.org/2.4.2/core/config/settings/mail_attribute/
mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

# Keep IMAP connections alive during idle instead of forking a new process
imap_hibernate_timeout = 5s

# Login processes: keep at least one pre-forked process per service so the
# first client never waits; cap at 100 clients per process
# https://doc.dovecot.org/2.4.2/core/config/login_processes.html
service imap-login {
  process_min_avail = 1
  client_limit = 100
}

service pop3-login {
  process_min_avail = 1
  client_limit = 100
}

service managesieve-login {
  process_min_avail = 1
  client_limit = 100
}

# doveadm HTTP API: disabled (no inet_listener means it only listens on the
# default unix socket, which is fine for local doveadm commands)
service doveadm {
}

# Allow vmail user (dovecot-lda) to write statistics events.
# The stats-writer socket is owned by root:dovecot by default; mode 0666
# lets the vmail process write to it without membership in the dovecot group.
service stats {
  unix_listener stats-writer {
    mode = 0666
  }
}

!include_try conf.d/*.conf
