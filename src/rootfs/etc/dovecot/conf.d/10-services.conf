# Service definitions
# https://doc.dovecot.org/2.4.2/core/config/service.html

# LMTP: accept mail from the MTA on port 24 (internal network only)
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# Auth: userdb socket for vmail processes, SASL port for Postfix smtp-auth
# https://doc.dovecot.org/2.4.2/core/config/auth/overview.html
service auth {
  unix_listener auth-userdb {
    user = vmail
    group = vmail
  }

  inet_listener sasl {
    port = 12345
  }
}

# Health check endpoint
# https://doc.dovecot.org/2.4.2/core/config/health_check.html
service health-check {
  executable = script -p /usr/local/bin/health-check.sh

  inet_listener health-check {
    port = 5001
  }
}

# Statistics and Prometheus metrics
# https://doc.dovecot.org/2.4.2/core/config/statistics.html

# Log all events in JSON format, consumed by metrics that include exporter = log
event_exporter log {
  format = json
  time_format = rfc3339
}

# Include backend statistics (sum, count, min, max, ...) for every metric below
@metric_defaults = backend

metric auth_success {
  filter = event=auth_request_finished AND success=yes
}

metric auth_failures {
  filter = event=auth_request_finished AND NOT success=yes
  exporter = log
}

metric imap_command {
  filter = event=imap_command_finished
  group_by cmd_name {
    method discrete {
    }
  }
  group_by tagged_reply_state {
    method discrete {
    }
  }
}

metric smtp_command {
  filter = event=smtp_server_command_finished AND protocol=submission
  group_by cmd_name {
    method discrete {
    }
  }
  group_by status_code {
    method discrete {
    }
  }
  group_by duration {
    method exponential {
      min_magnitude = 1
      max_magnitude = 5
      base = 10
    }
  }
}

metric lmtp_command {
  filter = event=smtp_server_command_finished AND protocol=lmtp
  group_by cmd_name {
    method discrete {
    }
  }
  group_by status_code {
    method discrete {
    }
  }
  group_by duration {
    method exponential {
      min_magnitude = 1
      max_magnitude = 5
      base = 10
    }
  }
}

metric mail_deliveries {
  filter = event=mail_delivery_finished
  group_by duration {
    method exponential {
      min_magnitude = 1
      max_magnitude = 5
      base = 10
    }
  }
}

# Prometheus endpoint at /metrics (non-SSL; TLS is terminated externally)
# https://doc.dovecot.org/2.4.2/core/config/statistics.html
service stats {
  inet_listener http {
    port = 9900
    ssl = no
  }
}
