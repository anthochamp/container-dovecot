# Sieve interpreter and Pigeonhole plugin configuration
# https://doc.dovecot.org/2.4.2/core/plugins/sieve.html

# Pigeonhole plugins (IMAPSieve and Extprograms)
# https://doc.dovecot.org/2.4.2/core/plugins/pigeonhole/sieve/plugins.html
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

# Extensions restricted to global/admin scripts only
sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
}

# User's personal Sieve scripts, managed via ManageSieve
sieve_script personal {
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Global before-script: classify spam before the user's personal script runs
sieve_script global-spam {
  type = before
  path = /var/lib/dovecot/sieve/global-spam.sieve
}

# IMAPSieve: trigger Sieve scripts on IMAP move events (spam/ham reporting for Rspamd)
# https://doc.dovecot.org/2.4.2/core/plugins/pigeonhole/sieve/plugins/imapsieve.html
mailbox Junk {
  sieve_script report-spam {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/report-spam.sieve
  }
}

imapsieve_from Junk {
  sieve_script report-ham {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/report-ham.sieve
  }
}

# Extprograms plugin: pipe messages to external programs from Sieve scripts
# https://doc.dovecot.org/2.4.2/core/plugins/pigeonhole/sieve/plugins/extprograms.html
sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe
