# Authentication mechanisms
# https://doc.dovecot.org/2.4.2/core/config/auth/mechanisms/overview.html
auth_mechanisms = plain login

# SQL passdb/userdb — credentials defined in dovecot-sql.conf.ext.j2, rendered at startup
# https://doc.dovecot.org/2.4.2/core/config/auth/passdbs/sql.html
!include_try /etc/dovecot/dovecot-sql.conf.ext
