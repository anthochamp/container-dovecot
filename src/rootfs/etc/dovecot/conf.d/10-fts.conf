# Full-text search — flatcurve (Xapian-based) engine
# https://doc.dovecot.org/2.4.2/core/plugins/fts.html
# https://doc.dovecot.org/2.4.2/core/plugins/fts_flatcurve.html

mail_plugins {
  fts = yes
  fts_flatcurve = yes
}

# Index new messages automatically; keep up to 999 recent unindexed
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999

# Re-index missing messages on search instead of returning incomplete results
fts_search_add_missing = yes

# Text processing pipeline
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple

language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}

fts flatcurve {
  substring_search = yes
  # Commit to disk every 100 messages; balances write latency vs. I/O
  commit_limit = 100
}
